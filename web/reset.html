<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Password reset – Vault Store</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div id="site-header"></div>
<main><div class="wrap"><div class="page">
<h1>Set a new password</h1>
<p class="muted" style="margin:10px 0 22px">Use at least 8 characters. After a reset, all existing sessions are signed out.</p>
<form class="form card" id="rf" style="max-width:420px">
  <label class="fld"><span>New password</span><input name="password" type="password" required minlength="8" autocomplete="new-password"></label>
  <button class="btn btn-primary" id="rsub" type="submit">Update password</button>
</form>
</div></div></main>
<div id="site-footer"></div>
<script src="assets/config.js"></script>
<script src="assets/core.js"></script>
<script src="assets/reset.js"></script>
</body>
</html>
