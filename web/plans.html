<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plans – Vault Store</title>
<meta name="description" content="All subscription plans in one place, with live prices, stock and pre-order status.">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/styles.css">
<script src="assets/theme.js"></script>
</head>
<body>
<div id="site-header"></div>
<main>
<section style="padding-bottom:20px">
<div class="wrap">
<div class="eyebrow">Catalog</div>
<h1 style="font-size:clamp(32px,4.5vw,48px)">All plans</h1>
<p class="muted" style="margin-top:10px">Prices and stock are live. Select a product, choose a plan and pay from your wallet.</p>
</div>
</section>
<section style="padding-top:10px">
<div class="wrap">
<div id="plans-notice"></div>
<div class="shop">
<aside class="filters" id="filters">
<div class="fgroup"><h4>Categories</h4><div id="cats-list"></div></div>
<div class="fgroup"><h4>Price (USD)</h4><div class="prange"><input class="search" id="pmin" type="number" min="0" step="0.5" placeholder="Min"><span>–</span><input class="search" id="pmax" type="number" min="0" step="0.5" placeholder="Max"></div></div>
<div class="fgroup"><h4>Availability</h4>
<label class="chk"><input type="checkbox" id="f-stock"> In stock only</label>
<label class="chk"><input type="checkbox" id="f-instant"> Instant delivery</label>
<label class="chk"><input type="checkbox" id="f-pre"> Pre-order available</label></div>
<button class="btn btn-ghost btn-sm" id="reset" type="button">Reset filters</button>
</aside>
<div class="shop-main">
<div class="toolbar">
<input class="search" id="q" type="search" placeholder="Search products, plans or categories…" aria-label="Search">
<button class="btn btn-ghost btn-sm fbtn" id="ftoggle" type="button">Filters</button>
<select class="search" id="sort" aria-label="Sort by"><option value="featured">Featured</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option><option value="name">Name: A to Z</option></select>
<div class="vtoggle" role="group" aria-label="Layout"><button type="button" data-v="grid" class="on" aria-label="Grid">▦</button><button type="button" data-v="list" aria-label="List">☰</button></div>
</div>
<div class="tabs mtabs" id="tabs"></div>
<div class="fbar"><span class="muted small" id="count"></span><span id="achips"></span></div>
<div class="grid g-plans" id="plans"></div>
</div>
</div>
</div>
</section>
</main>
<div id="site-footer"></div>
<script src="assets/config.js"></script>
<script src="assets/core.js"></script>
<script src="assets/shop.js"></script>
</body>
</html>
