<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plans – Vault Store</title>
<meta name="description" content="All subscription plans in one place, with live prices, stock and pre-order status.">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div id="site-header"></div>
<main>
<section style="padding-bottom:20px">
<div class="wrap">
<div class="eyebrow">Catalog</div>
<h1 style="font-size:clamp(32px,4.5vw,48px)">All plans</h1>
<p class="muted" style="margin-top:10px">Prices and stock are live. Select a product, choose a plan and pay from your wallet.</p>
</div>
</section>
<section style="padding-top:10px">
<div class="wrap">
<div id="plans-notice"></div>
<div class="bar">
<input class="search" id="q" type="search" placeholder="Search your next favourite tool…" aria-label="Search">
<select class="search" id="sort" aria-label="Sort by" style="max-width:210px"><option value="featured">Sort: Featured</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option><option value="name">Name: A to Z</option></select>
</div>
<div class="tabs" id="tabs" style="margin-bottom:14px"></div>
<div class="fbar"><button class="tab" id="stockf" type="button">In stock only</button><span class="muted small" id="count"></span></div>
<div class="grid g-plans" id="plans"></div>
</div>
</section>
</main>
<div id="site-footer"></div>
<script src="assets/config.js"></script>
<script src="assets/core.js"></script>
<script src="assets/shop.js"></script>
</body>
</html>
